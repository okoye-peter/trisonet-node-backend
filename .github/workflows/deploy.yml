name: Deploy to Server

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-api-trisonet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update -y && sudo apt-get install -y sshpass

      - name: SSH and Deploy
        run: |
          timeout 900 sshpass -p "${{ secrets.DEPLOY_PASSWORD }}" \
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
                -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            pkill -f "api.trisonet.com/node_modules/.bin/tsc" || true
            git config --global --add safe.directory /var/www/api.trisonet.com
            cd /var/www/api.trisonet.com
            git fetch origin main
            git reset --hard origin/main
            npm install
            timeout 600 npm run build
            pm2 restart express-api || pm2 start dist/index.js --name express-api -i 2
            pm2 save
          '
