name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 30m
          script: |
            git config --global --add safe.directory /var/www/api.trisonet.com
            cd /var/www/api.trisonet.com
            git fetch origin main
            git reset --hard origin/main
            npm install
            npm run build
            su - apiuser -c "pm2 restart express-api && pm2 save"

