name: Deploy to Server

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-api-trisonet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 15m
          script: |
            set -e
            pkill -f "api.trisonet.com/node_modules/.bin/tsc" || true
            git config --global --add safe.directory /var/www/api.trisonet.com
            cd /var/www/api.trisonet.com
            git fetch origin main
            git reset --hard origin/main
            npm install
            timeout 600 npm run build
            pm2 restart express-api || pm2 start dist/index.js --name express-api -i 2
            pm2 save

